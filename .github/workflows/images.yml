# Builds the web, worker, renderer, sandbox and docs images (linux/amd64 on main, + linux/arm64 on v* tags, each on a
# native runner) and pushes them
# to GHCR: ghcr.io/<owner>/runbase-<target>.
# Tags: `latest` and the commit sha on main, the version on v* tags.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      multiarch:
        description: "Also build linux/arm64 (always on release tags)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per image and platform, each on a native runner (arm64 on an arm runner, no QEMU),
  # pushed by digest; `merge` then publishes one multi-arch tag per image.
  build:
    strategy:
      fail-fast: true
      matrix:
        target: [web, worker, renderer, sandbox, docs]
        # main: amd64 only (production is x86_64); release tags (or `multiarch`): amd64 + arm64.
        platform: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.multiarch) && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/runbase-${{ matrix.target }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/runbase-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ steps.arch.outputs.name }}
          # Signed build provenance and SBOM attestations attached to the image.
          provenance: true
          sbom: true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.target }}-${{ steps.arch.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Multi-arch manifest per image, with the published tags.
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, worker, renderer, sandbox, docs]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/runbase-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runbase-${{ matrix.target }}
        run: |
          tags=()
          while read -r t; do tags+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - name: Inspect
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runbase-${{ matrix.target }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # Optional: tells a downstream repository (e.g. a hosting deployment) that the release images are
  # published, through a repository_dispatch event `runbase-release` with client_payload.tag = X.Y.Z.
  # Needs the secrets DOWNSTREAM_REPO (owner/name) and DOWNSTREAM_DISPATCH_TOKEN (fine-grained token,
  # that repository only, Contents: read and write). Skipped when they are not set.
  notify:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          REPO: ${{ secrets.DOWNSTREAM_REPO }}
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$REPO" ] || [ -z "$GH_TOKEN" ]; then echo "No downstream configured"; exit 0; fi
          gh api "repos/$REPO/dispatches" -f event_type=runbase-release -f "client_payload[tag]=${TAG#v}"
