# Builds the web, worker, renderer, sandbox and docs images (linux/amd64 on main, + linux/arm64 on v* tags) and pushes them
# to GHCR: ghcr.io/<owner>/runbase-<target>.
# Tags: `latest` and the commit sha on main, the version on v* tags.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, worker, renderer, sandbox, docs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/runbase-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          # arm64 under QEMU: ~50 min for the web Next build (9 min on amd64). On main, amd64 only
          # (production is x86_64); multi-arch only on release tags.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # Signed build provenance and SBOM attestations attached to the image.
          provenance: true
          sbom: true

  # Optional: tells a downstream repository (e.g. a hosting deployment) that the release images are
  # published, through a repository_dispatch event `runbase-release` with client_payload.tag = X.Y.Z.
  # Needs the secrets DOWNSTREAM_REPO (owner/name) and DOWNSTREAM_DISPATCH_TOKEN (fine-grained token,
  # that repository only, Contents: read and write). Skipped when they are not set.
  notify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          REPO: ${{ secrets.DOWNSTREAM_REPO }}
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$REPO" ] || [ -z "$GH_TOKEN" ]; then echo "No downstream configured"; exit 0; fi
          gh api "repos/$REPO/dispatches" -f event_type=runbase-release -f "client_payload[tag]=${TAG#v}"
